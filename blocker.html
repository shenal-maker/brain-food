<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Brain Food</title>
  <link rel="stylesheet" href="blocker.css">
</head>
<body>
  <h1>Brain Food</h1>
  <p class="subtitle">Complete your exercise to unlock browsing</p>

  <div class="xp-bar">
    <div class="label"><span id="xp-text">0 XP</span><span id="streak-text">0 day streak</span></div>
    <div class="track"><div class="fill" id="xp-fill" style="width:0%"></div></div>
  </div>

  <div class="timer" id="timer">10:00</div>

  <!-- Video Section -->
  <div class="section" id="video-section">
    <h2 id="video-title">Loading video...</h2>
    <div class="video-container">
      <iframe id="video-frame" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
    <a id="video-link" href="#" target="_blank" style="color:#4f46e5; display:none; margin-top:8px;">
      Video not loading? Open in new tab
    </a>
  </div>

  <!-- Notes -->
  <div class="section" id="notes-section">
    <h2>Notes</h2>
    <textarea id="notes" placeholder="Jot down anything important..." rows="4" style="width:100%;background:#252525;border:1px solid #333;border-radius:6px;color:#e0e0e0;padding:10px;font-size:0.9rem;resize:vertical;font-family:inherit;"></textarea>
  </div>

  <!-- One-sentence takeaway -->
  <div class="section" id="takeaway-section">
    <h2>One-Sentence Takeaway</h2>
    <p style="color:#888;font-size:0.85rem;margin-bottom:8px;">Summarize the key idea in your own words.</p>
    <input id="takeaway" type="text" placeholder="The main thing I learned is..." style="width:100%;background:#252525;border:1px solid #333;border-radius:6px;color:#e0e0e0;padding:10px;font-size:0.9rem;">
  </div>

  <!-- Math Problems -->
  <div class="section" id="math-section">
    <h2>Check-in Questions</h2>
    <div id="problems-container"></div>
  </div>

  <!-- Personal Challenge -->
  <div class="section" id="challenge-section">
    <h2>Personal Challenge</h2>
    <div id="challenge-container"></div>
  </div>

  <button class="btn" id="submit-btn" disabled>Complete Exercise</button>
  <div id="result"></div>
  <canvas id="confetti-canvas" style="position:fixed;inset:0;pointer-events:none;z-index:9999;"></canvas>

  <script src="blocker.js"></script>
</body>
</html>
