<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:320px; padding:16px; background:#0f0f0f; color:#e0e0e0; font-family:-apple-system,sans-serif; font-size:14px; }
  h1 { font-size:1.2rem; margin-bottom:12px; color:#fff; }
  label { display:block; margin-bottom:4px; color:#aaa; font-size:0.85rem; }
  textarea,input { width:100%; padding:8px; background:#1a1a1a; border:1px solid #333; border-radius:6px; color:#e0e0e0; font-size:13px; margin-bottom:12px; }
  textarea { height:80px; resize:vertical; }
  .btn { background:#4f46e5; color:#fff; border:none; padding:10px 20px; border-radius:6px; cursor:pointer; width:100%; font-size:14px; margin-bottom:8px; }
  .btn:hover { background:#4338ca; }
  .stats { background:#1a1a1a; padding:10px; border-radius:6px; margin-bottom:12px; }
  .stats span { display:block; }
  .links { margin-bottom:12px; }
  .links a { color:#4f46e5; text-decoration:none; margin-right:12px; font-size:0.9rem; }
  .links a:hover { text-decoration:underline; }
</style>
</head><body>
  <h1>Brain Food Settings</h1>
  <div class="stats">
    <span id="xp-stat">XP: 0</span>
    <span id="streak-stat">Streak: 0 days</span>
  </div>
  <div class="links">
    <a href="app.html" target="_blank">Brain Food App</a>
  </div>
  <label>Blocked sites (one per line)</label>
  <textarea id="sites"></textarea>
  <label>Timer (seconds)</label>
  <input type="number" id="timer" value="600">
  <label>Browse interval (minutes before nudge)</label>
  <input type="number" id="interval" value="45" min="1">
  <label>Nudge duration (minutes before full block)</label>
  <input type="number" id="nudge" value="5" min="1">
  <button class="btn" id="save">Save</button>
  <script src="settings.js"></script>
</body></html>
